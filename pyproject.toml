[project]
name = "warehouse-twin"
version = "0.1.0"
description = "Deterministic warehouse digital twin engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
warehouse-twin = "warehouse_twin.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warehouse_twin"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
